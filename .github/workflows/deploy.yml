name: Deploy to AWS

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | python3 -c \
            "import sys,base64,json; p=sys.stdin.read().strip(); p+='='*(-len(p)%4); \
             c=json.loads(base64.urlsafe_b64decode(p)); \
             print(json.dumps({k:c.get(k) for k in ['sub','aud','iss','repository','ref']}, indent=2))"

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::659791935620:role/GitHubActions-diniss12-gymsoftware
          aws-region: eu-west-1
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      - name: Test AWS Connection
        run: |
          aws sts get-caller-identity